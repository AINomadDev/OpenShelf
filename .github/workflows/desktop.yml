name: Desktop
on:
  push: { branches: [main], paths: ["desktop/**", "providers.json"] }
  pull_request: { paths: ["desktop/**", "providers.json"] }
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix: { os: [ubuntu-22.04, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop/src-tauri } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test
      - run: cargo build --release
