name: Release
# Push a tag such as v0.2.0 to build downloadable artifacts. Builds are unsigned; see the README.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-core.sh
      - run: ./scripts/build-app.sh
      - run: ditto -c -k --keepParent dist/OpenShelf.app OpenShelf-macOS.zip
      - uses: softprops/action-gh-release@v2
        with: { files: OpenShelf-macOS.zip }
  desktop:
    strategy:
      matrix: { os: [ubuntu-22.04, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop/src-tauri } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then cp target/release/openshelf-desktop.exe ../../OpenShelf-windows-x64.exe; else cp target/release/openshelf-desktop ../../OpenShelf-linux-x64; fi
      - uses: softprops/action-gh-release@v2
        with: { files: "OpenShelf-*" }
