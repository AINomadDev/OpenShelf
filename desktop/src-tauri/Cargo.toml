[package]
name = "openshelf-desktop"
version = "0.1.0"
description = "OpenShelf for Windows and Linux: bring your own storage"
edition = "2021"
license = "MIT"

[lib]
name = "openshelf_core"
path = "src/lib.rs"

[[bin]]
name = "openshelf-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
